<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constitution AI - Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .search-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        #queryInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #queryInput:focus {
            border-color: #667eea;
        }
        
        #searchBtn {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        #searchBtn:hover {
            background: #5a6fd8;
        }
        
        #searchBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            display: none;
        }
        
        .results {
            display: grid;
            gap: 30px;
        }
        
        .result-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }
        
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .verified {
            background: #d4edda;
            color: #155724;
        }
        
        .sourced {
            background: #fff3cd;
            color: #856404;
        }
        
        .constitution-answer {
            line-height: 1.8;
            color: #333;
            font-size: 1.05rem;
        }
        
        .suggestions-grid {
            display: grid;
            gap: 15px;
        }
        
        .suggestion-card {
            border-left: 4px solid #ffc107;
            padding: 15px;
            background: #fff9e6;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        
        .suggestion-card:hover {
            transform: translateX(5px);
        }
        
        .suggestion-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 1.05rem;
        }
        
        .suggestion-snippet {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        
        .suggestion-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .suggestion-link:hover {
            text-decoration: underline;
        }
        
        .source-tag {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-top: 8px;
        }
        
        .no-suggestions {
            color: #666;
            font-style: italic;
            padding: 10px;
        }
        
        @media (max-width: 768px) {
            .search-box {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏛️ Constitution AI</h1>
            <p class="subtitle">Get verified constitutional answers + practical guidance</p>
        </header>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="queryInput" placeholder="Ask about your constitutional rights... (e.g., 'Article 21', 'Right to Education', 'FIR filing')">
                <button id="searchBtn">Search</button>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Searching Constitution and web resources...</p>
        </div>
        
        <div class="error" id="errorMessage"></div>
        
        <div class="results" id="resultsContainer" style="display: none;">
            <div class="result-card">
                <div class="card-header">
                    <div class="card-title">Constitutional Answer</div>
                    <div class="badge verified">✓ 100% Verified from Constitution</div>
                </div>
                <div class="constitution-answer" id="constitutionAnswer"></div>
            </div>
            
            <div class="result-card">
                <div class="card-header">
                    <div class="card-title">Practical Suggestions</div>
                    <div class="badge sourced">🌐 Web-Sourced Guidance</div>
                </div>
                <div class="suggestions-grid" id="suggestionsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const queryInput = document.getElementById('queryInput');
            const searchBtn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const resultsContainer = document.getElementById('resultsContainer');
            const constitutionAnswer = document.getElementById('constitutionAnswer');
            const suggestionsContainer = document.getElementById('suggestionsContainer');

            // Pre-fill with example queries for testing
            const exampleQueries = [
                "What does Article 21 say about right to life?",
                "How to file an FIR in India?",
                "Right to Education under Article 21A",
                "Freedom of speech Article 19"
            ];

            searchBtn.addEventListener('click', handleSearch);
            
            queryInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleSearch();
                }
            });

            // Add click handler for example queries
            queryInput.addEventListener('focus', function() {
                if (!this.value) {
                    this.placeholder = "Try: " + exampleQueries[Math.floor(Math.random() * exampleQueries.length)];
                }
            });

            function handleSearch() {
                const query = queryInput.value.trim();
                
                if (!query) {
                    showError('Please enter a question about constitutional rights');
                    return;
                }

                showLoading(true);
                hideError();
                resultsContainer.style.display = 'none';
                searchBtn.disabled = true;

                fetch('http://127.0.0.1:8000/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        query: query
                        
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    showLoading(false);
                    searchBtn.disabled = false;
                    
                    if (data.error) {
                        showError(data.error);
                        return;
                    }

                    resultsContainer.style.display = 'grid';
                    
                    // Display constitution answer
                    if (data.constitution_answer) {
                        constitutionAnswer.innerHTML = formatText(data.constitution_answer);
                    } else {
                        constitutionAnswer.innerHTML = '<em>No constitutional answer found for this query.</em>';
                    }

                    // Display suggestions
                    if (data.practical_suggestions && data.practical_suggestions.length > 0) {
                        updateSuggestions(data.practical_suggestions);
                    } else {
                        suggestionsContainer.innerHTML = '<p class="no-suggestions">No practical suggestions available. The constitutional answer above provides your verified information.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showLoading(false);
                    searchBtn.disabled = false;
                    showError('Connection error: Make sure the backend server is running on http://127.0.0.1:8000. Error: ' + error.message);
                });
            }

            function updateSuggestions(suggestions) {
                let suggestionsHTML = '';
                
                suggestions.forEach((item, index) => {
                    const title = item.title || `Practical Guidance ${index + 1}`;
                    const snippet = item.snippet || item.content || 'No description available';
                    const url = item.url || '#';
                    const source = item.source || 'Web Source';
                    
                    suggestionsHTML += `
                        <div class="suggestion-card">
                            <div class="suggestion-title">${escapeHtml(title)}</div>
                            <div class="suggestion-snippet">${escapeHtml(snippet)}</div>
                            <a href="${escapeHtml(url)}" class="suggestion-link" target="_blank" rel="noopener">→ Read more</a>
                            <div class="source-tag">Source: ${escapeHtml(source)}</div>
                        </div>
                    `;
                });
                
                suggestionsContainer.innerHTML = suggestionsHTML;
            }

            function formatText(text) {
                // Convert newlines to <br> tags for better formatting
                return escapeHtml(text).replace(/\n/g, '<br>');
            }

            function showLoading(show) {
                loading.style.display = show ? 'block' : 'none';
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }

            function hideError() {
                errorMessage.style.display = 'none';
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        });
    </script>
</body>
</html>
